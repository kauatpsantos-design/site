<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Windows 11 Simulator</title>\n    <style>\n        body { font-family: Arial, sans-serif; background-color: #0078d7; color: white; margin: 0; overflow: hidden; }\n        #bootScreen { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #0b4f9a; }\n        #loginScreen { display: none; justify-content: center; align-items: center; height: 100vh; background-color: #1a1a1a; }\n        .window { width: 300px; height: 200px; background: #fff; color: #000; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); visibility: hidden; }\n        .app { padding: 20px; }\n    </style>\n</head>\n<body>\n    <div id=\"bootScreen\">\n        <h1>Booting Windows 11...</h1>\n    </div>\n    <div id=\"loginScreen\">\n        <div class=\"window\" id=\"loginWindow\">\n            <h2>Login</h2>\n            <input type=\"text\" placeholder=\"Username\" id=\"username\"><br>\n            <input type=\"password\" placeholder=\"Password\" id=\"password\"><br>\n            <button onclick=\"login()\">Login</button>\n        </div>\n    </div>\n    <script>\n        function showLogin() {\n            document.getElementById(\"bootScreen\").style.display = \"none\";\n            document.getElementById(\"loginScreen\").style.display = \"flex\";\n            document.getElementById(\"loginWindow\").style.visibility = \"visible\";\n        }\n        function login() {\n            alert(\"Welcome to Windows 11\");\n        }\n        setTimeout(showLogin, 3000); // Simulate boot time\n    </script>\n</body>\n</html>
