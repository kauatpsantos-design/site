        .window { border: 1px solid #ccc; background: white; position: absolute; }
        .file-explorer { display: flex; flex-direction: column; width: 300px; border-right: 1px solid #ccc; }
        .file { padding: 5px; cursor: pointer; }

        #notification-area { position: absolute; bottom: 0; width: 100%; height: 200px; background: white; display: none; }
